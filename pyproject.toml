[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "piwavelet"
version = "2.0.0"

description = "Pure Python wavelet, cross-wavelet and wavelet coherence analysis"

readme = "README.md"

license = { text = "BSD-3-Clause" }

authors = [
  { name = "Eduardo dos Santos Pereira" },
]

requires-python = ">=3.10"

keywords = [
  "wavelet",
  "wavelet coherence",
  "cross wavelet",
  "signal processing",
  "time series",
  "spectral analysis",
]

classifiers = [
  "Development Status :: 3 - Alpha",

  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",

  "License :: OSI Approved :: BSD License",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]


dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.11",
  "black>=25",
  "mypy>=1.15",
  "ipykernel>=6",
  "jupyterlab>=4",
]

docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/piwavelet"]