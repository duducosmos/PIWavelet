[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piwavelet"
version = "2.0.0a1"
description = "Pure Python wavelet, cross-wavelet and wavelet coherence analysis"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Eduardo dos Santos Pereira"},
]
requires-python = ">=3.10"

dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "mypy",
]